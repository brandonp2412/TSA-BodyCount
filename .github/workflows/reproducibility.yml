name: Reproducibility

on:
  push:
  pull_request:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate results and charts
        run: make all
      - name: Verify generated artifacts are committed
        run: git diff --exit-code -- results charts
